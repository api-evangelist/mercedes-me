  first_party_registry_packages: 0
  first_party_repos: 13
  archived_repos: 12
  maintained_repos: 1
  finding: >-
    Twelve of thirteen first-party integration repositories are archived. Not one Mercedes-Benz API client
    library is installable from npm, PyPI, Maven Central, NuGet, RubyGems, Packagist, crates.io or
    pkg.go.dev. An integrator building against Mercedes-Benz today writes their own HTTP client.
