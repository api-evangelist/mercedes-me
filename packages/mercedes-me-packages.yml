source: >-
  GitHub REST API queries against the github.com/mercedes-benz organisation (repos, releases, tags),
  registry metadata lookups against registry.npmjs.org, search.maven.org and pypi.org, and the SDK links
  already recorded in apis.yml.
description: >-
  Mercedes-Benz publishes NO first-party client library for its public APIs to ANY package registry.
  Every Mercedes-Benz mobile SDK is distributed as a GitHub repository only, and every one of those
  repositories is ARCHIVED with no push since 2021 — while the APIs they wrap are still being sold. That
  is the strongest decay signal available for this provider and it is provider-published and dated.
registry_searches:
  - registry: npm
    query: 'mercedes-benz, scope:daimler'
    result: >-
      No API client library. The only first-party Mercedes-Benz packages on npm are the @daimler/ftk-*
      MO360 Frontend Toolkit modules, which are a React/TypeScript UI toolkit and NOT a client for any
      Mercedes-Benz API. Deliberately excluded from packages[] below rather than counted as an SDK.
  - registry: maven-central
    query: 'mbsdk, mercedes'
    result: 'numFound 0 for mbsdk — the Android MBSDK modules were never published to Maven Central.'
  - registry: pypi
    query: mercedes
    result: >-
      No Mercedes-Benz API client. odxtools (authored by mbition.io engineers) is an ODX diagnostic-file
      toolkit, not a client for these APIs. Excluded.
  - registry: cocoapods
    query: MBSDK
    result: not probed — the iOS repositories were archived before a podspec release and carry no releases
