    mapping_confidence: high
    mapping_basis: scope string names the product and its version
  - scope: mb:vehicle:mbdata:payasyoudrive
    product: Pay As You Drive Insurance API (v1)
    grants: Odometer reading and geographic position for usage-based insurance.
    mapping_confidence: high
    mapping_basis: scope string names the product
  - scope: mb:vehicle:mbdata:payasyoudrive2.0
