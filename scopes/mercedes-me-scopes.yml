description: >-
  The Mercedes-Benz connected-vehicle APIs authenticate against the Mercedes-Benz customer identity
  provider at https://id.mercedes-benz.com (PingFederate). Its OpenID Connect discovery document is
  public and unauthenticated, and it publishes the complete scopes_supported list — 81 scopes, of
  which 38 are Mercedes-Benz product scopes. This artifact records those scopes verbatim as probed,
  together with the API product each scope string names. Mercedes-Benz publishes NO OpenAPI
  securitySchemes for the connected-vehicle products (the four Swagger 2.0 documents in openapi/
  carry no securityDefinitions at all), so the discovery document is the only machine-readable
  scope reference the provider publishes.
authorization_server:
  issuer: https://id.mercedes-benz.com
  authorization_endpoint: https://id.mercedes-benz.com/as/authorization.oauth2
  token_endpoint: https://id.mercedes-benz.com/as/token.oauth2
  revocation_endpoint: https://id.mercedes-benz.com/as/revoke_token.oauth2
  introspection_endpoint: https://id.mercedes-benz.com/as/introspect.oauth2
  userinfo_endpoint: https://id.mercedes-benz.com/idp/userinfo.openid
  jwks_uri: https://id.mercedes-benz.com/pf/JWKS
  registration_endpoint: https://id.mercedes-benz.com/as/clients.oauth2
  pushed_authorization_request_endpoint_present: true
  device_authorization_endpoint_present: true
  end_session_endpoint_present: true
  code_challenge_methods_supported: [plain, S256]
  grant_types_supported:
    - authorization_code
    - refresh_token
    - client_credentials
    - implicit
    - password
    - urn:ietf:params:oauth:grant-type:jwt-bearer
    - urn:ietf:params:oauth:grant-type:saml2-bearer
    - urn:ietf:params:oauth:grant-type:device_code
    - urn:ietf:params:oauth:grant-type:token-exchange
    - urn:openid:params:grant-type:ciba
    - urn:pingidentity.com:oauth2:grant_type:validate_bearer
  token_endpoint_auth_methods_supported:
    - client_secret_basic
    - client_secret_post
    - client_secret_jwt
    - private_key_jwt
    - tls_client_auth
    - none
scope_count: 81
product_scope_count: 38
scopes:
  # --- Connected vehicle data products (the Mercedes me / connected-vehicle API family) ---
  - scope: mb:vehicle:mbdata:vehiclestatus
    product: Vehicle Status API
    grants: Door, window, deck-lid, sunroof, tyre-pressure and overall lock state by VIN.
    mapping_confidence: high
    mapping_basis: scope string names the product (mbdata + vehiclestatus)
  - scope: mb:vehicle:mbdata:vehiclestatus15
    product: Vehicle Status API
    grants: Extended Vehicle Status signal set (15-signal variant).
    mapping_confidence: medium
    mapping_basis: scope string names the product; the "15" suffix is not explained in any public Mercedes-Benz document we could read
  - scope: mb:vehicle:mbdata:vehiclelock
    product: Vehicle Lock Status API
    grants: Door-lock, deck-lid and position-lock state by VIN.
    mapping_confidence: high
    mapping_basis: scope string names the product
  - scope: mb:vehicle:mbdata:fuelstatus
    product: Fuel Status API
    grants: Tank level and remaining fuel range by VIN.
    mapping_confidence: high
    mapping_basis: scope string names the product
  - scope: mb:vehicle:mbdata:evstatus
    product: Electric Vehicle Status API (v1)
    grants: State of charge, electric range and charge status.
    mapping_confidence: high
    mapping_basis: scope string names the product
  - scope: mb:vehicle:mbdata:evstatus2.0
    product: Electric Vehicle Status API (v2)
    grants: v2 signal set, including remote charge control surface.
    mapping_confidence: high
    mapping_basis: scope string names the product and its version
  - scope: mb:vehicle:mbdata:evstatus3.0
    product: Electric Vehicle Status API (v3)
