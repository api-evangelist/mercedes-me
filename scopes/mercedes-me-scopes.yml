notes:
  - >-
    Scope-to-product mapping is stated with an explicit confidence on every row. Where Mercedes-Benz
    publishes no readable reference for a scope string, the row says so rather than guessing —
    the developer portal is a client-rendered SPA whose reference pages return an empty HTML shell
    to any non-browser client, so the per-product scope tables could not be read.
  - >-
    The eleven Car Configurator / Dealer / Vehicle Images / Remote Diagnostic Support OpenAPI
    documents in openapi/ authenticate with an API key, not OAuth — their 401 response description
    reads "Failed to resolve API Key query parameter / Invalid API Key". The OAuth scopes above
    apply to the connected-vehicle product family, which publishes no OpenAPI.
  - >-
    The presence of an mb:vehicle:mbdata:euda:* scope family is a substantive finding: Mercedes-Benz
    has provisioned EU Data Act in-vehicle data categories as first-class OAuth scopes on its
    production identity provider.
