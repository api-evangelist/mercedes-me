- aid: mercedes-me:mercedes-benz-fleet-api
  name: Mercedes-Benz Fleet API
  tags:
  - Automotive
  - Connected Vehicle
  - Fleet Management
  - Kafka
  - Mercedes-Benz
  - Streaming
  - Telematics
  humanURL: https://developer.mercedes-benz.com/products/mercedes-benz_fleet_api
  properties:
  - url: https://developer.mercedes-benz.com/products/mercedes-benz_fleet_api
    type: Documentation
  - url: https://connectivity.mercedes-benz.com/products/mercedes-benz-fleet-api
    type: Documentation
  - url: https://github.com/mercedes-benz/kafka-integration-samples
    type: SDKs
    name: Kafka Integration Samples
  description: >-
    The Mercedes-Benz Fleet API integrates vehicle data into fleet management systems without retrofit
    hardware. It splits into a REST Management API (add vehicles, activate/deactivate per-vehicle data
    packages, issue remote commands) and a Kafka Push API that streams location, mileage, fuel/charge,
    vehicle health, tires, door/window status, driving behavior, and anti-theft events. Packages are activated
    individually at vehicle level.
