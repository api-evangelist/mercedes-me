name: Mercedes-Benz Mercedes me
description: >-
  Mercedes-Benz operates one of the few genuinely public OEM API platforms. Its /developers portal at
  developer.mercedes-benz.com sells connected-vehicle data as individually-subscribable products —
  Vehicle Status, Vehicle Lock Status, Fuel Status, Electric Vehicle Status and Pay As You Drive — each
  gated by its own OAuth 2.0 scope and each requiring the vehicle owner's explicit per-signal consent,
  granted through the Mercedes-Benz identity provider at id.mercedes-benz.com. Alongside them sit four
  content and service APIs with published Swagger 2.0 contracts: the Car Configurator, the Dealer API,
  the Vehicle Images API and Remote Diagnostic Support. Mercedes-Benz Connectivity Services GmbH sells
  the Fleet API separately, pairing a REST management surface with a managed Apache Kafka push channel
  that streams nineteen activatable telemetry packages plus five remote-command packages, including
  remote door lock and unlock. Every API is versioned by URI path and shipped with a *_tryout sandbox
  base path on the same host.
maintainers:
  - FN: API Evangelist
    email: info@apievangelist.com
    url: https://apievangelist.com
    role: profile-maintainer
    note: >-
      This profile is maintained by API Evangelist, not by Mercedes-Benz. Mercedes-Benz publishes no
      maintainer contact for its API platform; support is a ticket inside the authenticated portal.
