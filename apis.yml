  description: >-
    The Vehicle Status API delivers real-time vehicle state — doors, windows, deck lid, sunroof, tire
    pressure, and overall lock state — for a customer-consented Mercedes-Benz vehicle by VIN. Returns
    last-known timestamps and uses the standard Mercedes-Benz OAuth 2.0 customer-consent flow.
