emission_models:
  note: >-
    The configurator model carries BOTH the NEDC and the WLTP European emissions/consumption schema
    families as separate definition trees (Nedc, NedcAmount, NedcConsumption, NedcEmission, NedcGear and
    Wltp, WltpAmount, WltpConsumption, WltpEmission, WltpGear). That is a regulatory data model, not a
    Mercedes-Benz invention, and it is the closest thing in this contract to a domain standard.
graph_disconnection:
  finding: >-
    The three graphs share no foreign key. A caller holding a configurationId cannot reach a Dealer, and a
    caller holding a vehicleId cannot reach a VehicleConfiguration. The Vehicle Images API is keyed by
    finorvin while Remote Diagnostic Support is keyed by vehicleId and the configurator by
    market/model/configuration — three different vehicle identities across one vendor's estate.
