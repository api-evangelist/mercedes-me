source: >-
  Derived from the 109 `definitions` and the path structure of the four provider-published Swagger 2.0
  documents in openapi/_original/ (Car Configurator, Dealer, Vehicle Images, Remote Diagnostic Support) and
  their eleven refined per-tag descendants in openapi/. Relationships come from $ref links between
  definitions and from path-nesting; nothing was inferred from marketing copy.
description: >-
  The Mercedes-Benz public API data model is three loosely-coupled graphs sharing one identifier concept.
  The configurator graph is keyed by a market/model/configuration triple, the diagnostics graph is keyed by
  vehicleId, and the imagery graph is keyed by FIN/VIN. There is no single root entity and no cross-graph
  reference — the three products do not link to one another.
identifiers:
  - id: finorvin
    name: FIN / VIN
    description: >-
      Vehicle Identification Number (FIN is the Mercedes-Benz term). The path key for the Vehicle Images
      API and the customer-vehicle key for the whole connected-vehicle family.
    format: opaque string, 17 characters in practice
    used_by: [Vehicle Images API, Components, Perspectives, connected-vehicle products]
  - id: vehicleId
    name: vehicleId
    description: The Remote Diagnostic Support key for a vehicle.
    used_by: [Remote Diagnostic Support API]
    note: >-
      Published as a separate parameter name from finorvin. Mercedes-Benz does not state in the contract
      whether the two are the same value, which is a real interoperability gap between its own products.
  - id: marketId
    name: marketId
    description: Country/market scope for all configurator reference data. Prefixes every configurator path.
  - id: modelId
    name: modelId
    description: Vehicle model within a market.
  - id: configurationId
    name: configurationId
    description: A specific vehicle configuration within a model.
  - id: onlineCode
    name: onlineCode
    description: Shareable handle for a saved configuration.
  - id: dealerId
    name: dealerId
  - id: ecuId
    name: ecuId
    description: Electronic Control Unit identifier within a vehicle.
  - id: dtcId
    name: dtcId
    description: Diagnostic Trouble Code identifier within an ECU.
