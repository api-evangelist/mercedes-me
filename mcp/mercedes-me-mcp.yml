source: >-
  No Mercedes-Benz MCP server exists. Searched the github.com/mercedes-benz organisation (all repositories
  listed via the GitHub API — the only MCP repository there is a FORK of github/github-mcp-server, marked
  "This is a fork ... for the purpose of contributing", which is not a Mercedes-Benz API server), the npm
  registry, and the Mercedes-Benz developer portal. Probed /.well-known/agent-card.json and
  /.well-known/agent.json on every host in the estate — all soft-404s, 401s, 404s or 403s. The tool list
  below is DERIVED from the 39 operations in the eleven refined OpenAPI documents in openapi/. It is a
  candidate: Mercedes-Benz ships nothing.
description: >-
  A candidate MCP tool surface for the four Mercedes-Benz APIs that have a published contract. Mercedes-Benz
  publishes no MCP server, no agent card and no agent-facing surface of any kind.
deployment:
  mode: none
  endpoint: null
  install: null
  package: null
  auth: unknown
  verified: searched
  note: >-
    Nobody ships a server. `endpoint` is deliberately empty — guessing an MCP URL that happened to answer
    200 would read as a verified agent surface that Mercedes-Benz has not built.
searched:
  - target: github.com/mercedes-benz organisation
    method: GitHub REST API repository listing
    result: >-
      One repository matching "mcp": github-mcp-server, explicitly described as a fork of
      github/github-mcp-server for upstream contribution. Not a Mercedes-Benz API server.
  - target: npm registry
    query: 'mercedes-benz, scope:daimler'
    result: no MCP package
  - target: developer.mercedes-benz.com
    result: >-
      Client-rendered SPA; every path returns the same HTML shell. robots.txt disallows /console/, /api/,
      /config/ and /ciam/. No MCP, agent or LLM surface discoverable.
  - target: '/.well-known/agent-card.json and /.well-known/agent.json'
    hosts: [developer.mercedes-benz.com, api.mercedes-benz.com, connectivity.mercedes-benz.com, www.mercedes-benz.com]
    result: no agent card on any host — see well-known/mercedes-me-well-known.yml
