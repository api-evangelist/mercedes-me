method: probed
source: >-
  Direct unauthenticated HTTP probes of every host named in apis.yml (developer.mercedes-benz.com,
  api.mercedes-benz.com, connectivity.mercedes-benz.com, www.mercedes-benz.com) plus the
  Mercedes-Benz customer identity provider id.mercedes-benz.com, which is the OAuth 2.0
  authorization server the connected-vehicle APIs authenticate against.
description: >-
  Mercedes-Benz serves NO /.well-known documents from its developer portal or its API gateway.
  developer.mercedes-benz.com is a client-rendered single-page application that answers HTTP 200
  with the same ~4.3 KB HTML shell for every path, including paths that do not exist — so a 200
  there is a soft-404, not a document. api.mercedes-benz.com answers 401 "No credentials provided"
  for every /.well-known path. The one real hit in the estate is the Mercedes-Benz identity
  provider id.mercedes-benz.com, which publishes a complete OpenID Connect discovery document
  and an OAuth 2.0 authorization-server metadata document. Those two files are the authoritative,
  provider-published source for every OAuth scope, endpoint and grant type used by the
  Mercedes-Benz connected-vehicle APIs, and they are saved verbatim here.
hosts:
  - host: id.mercedes-benz.com
    note: >-
      Mercedes-Benz customer identity provider (PingFederate). Issuer https://id.mercedes-benz.com.
      This is the authorization server behind the Mercedes-Benz OAuth 2.0 customer-consent flow
      used by Vehicle Status, Fuel Status, Electric Vehicle Status, Vehicle Lock Status and
      Pay As You Drive — the scopes_supported list in the saved document contains the exact
      mb:vehicle:* scope strings those products require.
    documents:
      - path: /.well-known/openid-configuration
        status: 200
        content_type: application/json
        file: mercedes-me-id-openid-configuration.json
      - path: /.well-known/oauth-authorization-server
